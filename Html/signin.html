<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create your MoneyMap account.">
    <title>Sign In – MoneyMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/signin-styles.css">
    <script type="module" src="../Javasxript/firebaseauth.js"></script>
</head>
<body>

    <!-- Back to home -->
    <a href="Main.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        MoneyMap
    </a>

    <div class="auth-wrapper">

        <!-- Sign In Form -->
        <div class="auth-card" id="signIn">
            <div class="auth-header">
                <span class="logo">MoneyMap</span>
                <h1>Welcome back</h1>
                <p>Sign in to your account to continue</p>
            </div>

            <div id="signInMessage" class="message-div" style="display:none;"></div>

            <form method="post" action="" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        <input type="password" id="password" placeholder="Your password" required>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="submitSignIn">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account?</p>
                <button id="signUpButton" class="btn btn-ghost">Create account</button>
            </div>
        </div>

        <!-- Sign Up Form -->
        <div class="auth-card" id="signup" style="display:none;">
            <div class="auth-header">
                <span class="logo">MoneyMap</span>
                <h1>Create account</h1>
                <p>Start tracking your finances for free</p>
            </div>

            <div id="signUpMessage" class="message-div" style="display:none;"></div>

            <form method="post" action="" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fName">First Name</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <input type="text" id="fName" placeholder="First name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lName">Last Name</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <input type="text" id="lName" placeholder="Last name" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="rEmail">Email</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="rEmail" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="rPassword">Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        <input type="password" id="rPassword" placeholder="Min. 6 characters" required>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="submitSignUp">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account?</p>
                <button id="signInButton" class="btn btn-ghost">Sign in</button>
            </div>
        </div>

    </div>

    <!-- Sign In / Sign Up toggle script (no Firebase needed) -->
    <script>
        document.getElementById('signUpButton')?.addEventListener('click', function() {
            document.getElementById('signIn').style.display = 'none';
            document.getElementById('signup').style.display = 'flex';
        });
        document.getElementById('signInButton')?.addEventListener('click', function() {
            document.getElementById('signup').style.display = 'none';
            document.getElementById('signIn').style.display = 'flex';
        });
    </script>
</body>
</html>
